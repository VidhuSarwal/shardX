# Production stack on the EC2 host (see infrastructure/terraform/modules/compute).
# api and shardworker share /data/uploads: the worker retries chunk files the API spooled.
# State lives in AWS (DynamoDB, S3, Cognito); nothing here needs a database container.
services:
  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: .env
    ports: ["80:5555"]
    volumes: [uploads:/data/uploads]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5555/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  shardworker:
    build: ../apps/api
    command: shardworker
    restart: unless-stopped
    env_file: .env
    volumes: [uploads:/data/uploads]

volumes:
  uploads:
